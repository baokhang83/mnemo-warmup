# Dependency and action updates (security roadmap, Phase 0). Only what ships is covered: the Maven reactor, the Go launcher, the
# workflows, and the tools image. The benchmark and example projects are not shipped and are left out to keep the noise down.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: deps }
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /launcher
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: deps }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: ci }
    # Only minor and patch bumps are grouped. A major version of an action is its own pull request, reviewed on its own:
    # the release and publish workflows only run on tags, so a major bump there cannot be proven by this repository's PR checks.
    groups:
      # Every step of github/codeql-action must run the same version, or analyze refuses the config init wrote. Dependabot
      # sees init and analyze as separate dependencies, so they are grouped at every update type, majors included. CodeQL
      # runs on every pull request, so its PR checks do prove a major bump. This group must stay first: a dependency joins
      # the first group it matches.
      codeql-action:
        patterns: ["github/codeql-action*"]
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /image
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: deps }
