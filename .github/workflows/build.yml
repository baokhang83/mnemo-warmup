name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify

      # Coverage comes from the JDK 21 leg only: one report, one badge, no race between legs.
      - name: Generate JaCoCo badge
        if: matrix.java == 21
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8 # v2
        with:
          jacoco-csv-file: coverage/target/site/jacoco-aggregate/jacoco.csv
          badges-directory: coverage/target/site/jacoco-aggregate/badges

      # Assemble the Pages site. Runs on pull requests too (nothing is deployed), so a broken layout fails review, not main.
      # gh-pages also serves the Helm repository (index.yaml, charts/, artifacthub-repo.yml), kept out of the clean-up below.
      - name: Assemble the GitHub Pages site
        if: matrix.java == 21
        run: |
          report=coverage/target/site/jacoco-aggregate
          out=pages-site
          rm -rf "$out"
          mkdir -p "$out/coverage"
          # Docs site (landing page, subpages, sitemap, robots) at the root.
          cp -R site/. "$out/"
          cp llms.txt "$out/llms.txt"
          scripts/build-llms-full.sh "$out/llms-full.txt"
          if [ -f artifacthub-repo.yml ]; then cp artifacthub-repo.yml "$out/artifacthub-repo.yml"; fi
          # The JaCoCo report moves under /coverage/ whole (it uses relative links).
          cp -R "$report/." "$out/coverage/"
          # The README coverage badge reads badges/jacoco.svg from the gh-pages branch root: keep it there.
          rm -rf "$out/coverage/badges"
          cp -R "$report/badges" "$out/badges"
          test -s "$out/badges/jacoco.svg"
          test -f "$out/index.html" && test -f "$out/coverage/index.html"
          # Ownership verification tags and crawler files must survive any edit of the site.
          grep -q 'name="google-site-verification" content="Q7SKsA-JukICYFV0a1XTQDHq_ZciLmj43Pjui4xJ_9Y"' "$out/index.html"
          grep -q 'name="msvalidate.01" content="F8E60EFE3EC283577A2A0DADE4A5D82E"' "$out/index.html"
          grep -q 'href="llms-full.txt">llms-full.txt</a>' "$out/index.html"
          grep -q 'llms-full.txt' "$out/sitemap.xml"
          # Helm repository files must not be produced here (they live on gh-pages and are excluded from the clean-up).
          test ! -e "$out/index.yaml" && test ! -e "$out/charts"

      - name: Publish coverage report to GitHub Pages
        if: matrix.java == 21 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: pages-site
          clean-exclude: |
            index.yaml
            artifacthub-repo.yml
            charts/**
