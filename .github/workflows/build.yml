name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify

      # Coverage comes from the JDK 21 leg only: one report, one badge, no race between legs.
      - name: Generate JaCoCo badge
        if: matrix.java == 21
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: coverage/target/site/jacoco-aggregate/jacoco.csv
          badges-directory: coverage/target/site/jacoco-aggregate/badges

      # gh-pages also serves the Helm repository (index.yaml, charts/, artifacthub-repo.yml): keep it out of the clean-up
      - name: Include Artifact Hub repository metadata
        if: matrix.java == 21 && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('artifacthub-repo.yml') != ''
        run: cp artifacthub-repo.yml coverage/target/site/jacoco-aggregate/artifacthub-repo.yml

      - name: Include llms.txt and llms-full.txt at the site root
        if: matrix.java == 21 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          site=coverage/target/site/jacoco-aggregate
          cp llms.txt "$site/llms.txt"
          scripts/build-llms-full.sh "$site/llms-full.txt"
          # Link them from the landing page (the JaCoCo report) so crawlers that do not guess root paths find them.
          # Fail loudly if JaCoCo's markup ever changes.
          grep -q '<div class="footer">' "$site/index.html"
          sed -i 's|<div class="footer">|<div class="footer"><span class="left"><a href="llms.txt">llms.txt</a> &middot; <a href="llms-full.txt">llms-full.txt</a></span>|' "$site/index.html"
          sed -i 's|</head>|<link rel="alternate" type="text/plain" href="llms.txt" title="llms.txt"/></head>|' "$site/index.html"
          grep -q 'href="llms-full.txt">llms-full.txt</a>' "$site/index.html"

      - name: Publish coverage report to GitHub Pages
        if: matrix.java == 21 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: coverage/target/site/jacoco-aggregate
          clean-exclude: |
            index.yaml
            artifacthub-repo.yml
            charts/**
