name: chart

# Lints and renders the Helm chart with several value sets and the parent-chart fixture (scripts/test-chart.sh).
# No cluster is needed; set KUBE_CONTEXT locally to also have a cluster's API server validate the manifests.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'deploy/helm/**'
      - 'examples/helm/**'
      - 'scripts/test-chart.sh'
      - 'scripts/test-nodecache-chart.sh'
      - '.github/workflows/chart.yml'

permissions:
  contents: read

jobs:
  chart:
    name: helm lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      # the Pod Security "restricted" check of the isolated training template parses YAML
      - run: python3 -c 'import yaml' 2>/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q python3-yaml)
      - run: scripts/test-chart.sh
      - run: scripts/test-nodecache-chart.sh
