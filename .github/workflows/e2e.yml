name: e2e

# The whole chain on a real cluster: trainer CronJob, Lease, fetch init container, run as PID 1, on JDK 21 (AppCDS)
# and JDK 25 (AOT). It takes several minutes (it builds a Spring Boot image per JDK and starts a kind cluster), so it
# runs on demand and when the pieces it exercises change on main.
#
# A second job (kind-inject) drives the annotated adoption path (Helm post-renderer, injected init containers, the
# native launcher, a distroless image) on amd64 and arm64 runners.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'warmup-core/**'
      - 'warmup-cli/**'
      - 'image/**'
      - 'deploy/helm/**'
      - 'examples/**'
      - 'scripts/e2e-kind.sh'
      - 'scripts/e2e-kind-inject.sh'
      - 'scripts/mnemo-warmup-inject'
      - 'launcher/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  kind:
    name: kind end-to-end (JDK 21 and 25, ${{ matrix.delivery }})
    strategy:
      fail-fast: false
      matrix:
        delivery: [init-container, image-volume]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.32.0
      - run: scripts/e2e-kind.sh 21 25
        env:
          TOOLS_DELIVERY: ${{ matrix.delivery }}
          KIND_NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
      - name: Collect logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.delivery }}
          path: /tmp/mw-e2e-*

  kind-inject:
    name: annotated adoption path (${{ matrix.arch }}, ${{ matrix.delivery }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        delivery: [init-container, image-volume]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Helm 3: the post-renderer here is a script path, which Helm 4 does not accept (docs/offline-injector.md)
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.32.0
      - run: scripts/e2e-kind-inject.sh
        env:
          TOOLS_DELIVERY: ${{ matrix.delivery }}
          KIND_NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
      - name: Collect logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-inject-logs-${{ matrix.arch }}-${{ matrix.delivery }}
          path: /tmp/mw-inj-*
