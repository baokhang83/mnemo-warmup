name: e2e

# The whole chain on a real cluster: trainer CronJob, Lease, fetch init container, run as PID 1, on JDK 21 (AppCDS)
# and JDK 25 (AOT). It takes several minutes (it builds a Spring Boot image per JDK and starts a kind cluster), so it
# runs on demand and when the pieces it exercises change on main.
#
# A second job (kind-inject) drives the annotated adoption path (Helm post-renderer, injected init containers, the
# native launcher, a distroless image) on amd64 and arm64 runners.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'warmup-core/**'
      - 'warmup-cli/**'
      - 'image/**'
      - 'deploy/helm/**'
      - 'examples/**'
      - 'scripts/e2e-kind.sh'
      - 'scripts/e2e-kind-inject.sh'
      - 'scripts/mnemo-warmup-inject'
      - 'launcher/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  kind:
    name: kind end-to-end (JDK 21 and 25)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
      - run: scripts/e2e-kind.sh 21 25
      - name: Collect logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: /tmp/mw-e2e-*

  kind-inject:
    name: annotated adoption path (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      # Helm 3: the post-renderer here is a script path, which Helm 4 does not accept (docs/offline-injector.md)
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
      - run: scripts/e2e-kind-inject.sh
      - name: Collect logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-inject-logs-${{ matrix.arch }}
          path: /tmp/mw-inj-*
