name: image

# Builds the tools image (image/Dockerfile) and checks it end to end in Docker; publishes it to GHCR
# for release tags. The image is JDK-free and runs inside the application image, see docs/adr/0004.

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths:
      - 'image/**'
      - 'scripts/**'
      - 'warmup-core/**'
      - 'warmup-cli/**'
      - 'pom.xml'
      - '.github/workflows/image.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish (for example v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify image (JDK 21 and 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and run the end-to-end check
        run: scripts/verify-image.sh 21 25

  publish:
    name: publish to GHCR
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a release tag such as v0.2.0"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive the version
        id: version
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/baokhang83/mnemo-warmup-tools:${{ steps.version.outputs.value }}
            ghcr.io/baokhang83/mnemo-warmup-tools:latest
