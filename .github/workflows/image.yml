name: image

# Builds the tools image (image/Dockerfile) and checks it end to end in Docker; publishes it to GHCR
# for release tags. The image is JDK-free and runs inside the application image, see docs/adr/0004.

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  pull_request:
    paths:
      - 'image/**'
      - 'launcher/**'
      - 'scripts/**'
      - 'warmup-core/**'
      - 'warmup-cli/**'
      - 'pom.xml'
      - '.github/workflows/image.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish (for example v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: resolve the revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      release: ${{ steps.r.outputs.release }}
      prerelease: ${{ steps.r.outputs.prerelease }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.sha }}
      # Resolved ONCE, to a commit SHA: verify and publish below both use exactly this commit, even for a
      # manual dispatch of an older tag, and even if the tag moves meanwhile.
      - id: r
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
              echo "::error::Expected a release tag such as v0.2.0"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            if [[ "$RELEASE_TAG" == *-beta.* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: verify image (JDK 21 and 25)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Build the image and run the end-to-end check
        run: scripts/verify-image.sh 21 25

  publish:
    name: publish to GHCR
    needs: [resolve, verify]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.resolve.outputs.version }}
          tags: |
            ghcr.io/baokhang83/mnemo-warmup-tools:${{ needs.resolve.outputs.version }}
            ${{ needs.resolve.outputs.prerelease != 'true' && 'ghcr.io/baokhang83/mnemo-warmup-tools:latest' || '' }}
