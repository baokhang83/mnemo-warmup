name: image

# Builds the tools image (image/Dockerfile) and checks it end to end in Docker; publishes it to GHCR
# for release tags. The image is JDK-free and runs inside the application image, see docs/adr/0004.

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths:
      - 'image/**'
      - 'launcher/**'
      - 'scripts/**'
      - 'warmup-core/**'
      - 'warmup-cli/**'
      - 'pom.xml'
      - '.github/workflows/image.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish (for example v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: resolve the revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      release: ${{ steps.r.outputs.release }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      # Resolved ONCE, to a commit SHA: verify and publish below both use exactly this commit, even for a
      # manual dispatch of an older tag, and even if the tag moves meanwhile.
      - id: r
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Expected a release tag such as v0.2.0"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: verify image (JDK 21 and 25)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Build the image and run the end-to-end check
        run: scripts/verify-image.sh 21 25

  publish:
    name: publish to GHCR
    needs: [resolve, verify]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.resolve.outputs.version }}
          tags: |
            ghcr.io/baokhang83/mnemo-warmup-tools:${{ needs.resolve.outputs.version }}
            ghcr.io/baokhang83/mnemo-warmup-tools:latest
