name: publish-cli

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/test-install.sh'
      - 'scripts/publish-cli-release.sh'
      - 'scripts/test-publish-cli-release.sh'
      - 'image/mnemo-warmup'
      - '.github/workflows/publish-cli.yml'

permissions:
  contents: read

jobs:
  test:
    name: test installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-install.sh
      - run: scripts/test-publish-cli-release.sh

  publish:
    name: publish CLI release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and checksum CLI assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || exit 1
          mvn -B -ntp versions:set -DnewVersion="${RELEASE_TAG#v}" -DgenerateBackupPoms=false
          mvn -B -ntp -pl warmup-cli -am -DskipTests -Djacoco.skip=true package
          mkdir -p release-cli
          cp warmup-cli/target/mnemo-warmup.jar release-cli/mnemo-warmup.jar
          cp image/mnemo-warmup release-cli/mnemo-warmup
          (cd release-cli && sha256sum mnemo-warmup.jar mnemo-warmup > SHA256SUMS)
      # Draft, upload every asset, then publish: a published release can be immutable and take no new assets (#142).
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/publish-cli-release.sh
