spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${BENCH_DB_URL:jdbc:postgresql://localhost:5432/bench}
spring.datasource.username=${BENCH_DB_USER:bench}
spring.datasource.password=${BENCH_DB_PASSWORD:bench}
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,prometheus
server.port=8080
