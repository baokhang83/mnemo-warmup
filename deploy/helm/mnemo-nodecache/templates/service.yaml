apiVersion: v1
kind: Service
metadata:
  name: {{ include "mnemo-nodecache.name" . }}
  labels:
    {{- include "mnemo-nodecache.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  internalTrafficPolicy: Local
  selector:
    {{- include "mnemo-nodecache.labels" . | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: https
