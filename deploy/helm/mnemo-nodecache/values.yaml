image:
  repository: ghcr.io/baokhang83/mnemo-warmup-tools
  # Set an explicit tools image tag containing mnemo-nodecache.
  tag: ""
  pullPolicy: IfNotPresent

# Existing Secret holding config.json, TLS certificate/key and source credentials.
configurationSecret: ""
imagePullSecrets: []

# The cache directory must be a subdirectory of /var/cache/mnemo. Configure
# maxTotalBytes below this limit, leaving room for filesystem overhead.
cacheVolumeSize: 2Gi
resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
    ephemeral-storage: 2Gi

nodeSelector:
  kubernetes.io/os: linux
tolerations: []
