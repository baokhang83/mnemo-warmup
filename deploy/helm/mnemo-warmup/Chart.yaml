apiVersion: v2
name: mnemo-warmup
description: Trains a startup cache (AppCDS or Leyden AOT) for a JVM application once per fingerprint and shares it with every replica through an init container.
type: application
version: 0.2.0
# The release this chart belongs to; it is also the default tools image tag (values.yaml tools.image.tag).
# Version, appVersion and that tag are always equal: scripts/stamp-chart.sh sets them on a release, scripts/test-chart.sh checks them.
appVersion: "0.2.0"
home: https://github.com/baokhang83/mnemo-warmup
sources:
  - https://github.com/baokhang83/mnemo-warmup
keywords: [jvm, appcds, leyden, startup, kubernetes]
maintainers:
