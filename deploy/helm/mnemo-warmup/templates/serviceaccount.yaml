{{- if and .Values.trainer.enabled .Values.trainer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mnemo-warmup.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mnemo-warmup.labels" . | nindent 4 }}
  {{- with .Values.trainer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
