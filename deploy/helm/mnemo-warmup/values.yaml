# The application the cache is trained for. It must be the SAME image (and JVM options and environment) your
# Deployment runs: an archive is only valid for that image's JDK build, JAR files, paths and modification times.
# The image needs Java 21+ (the tool runs inside it) and the JAR must be the extracted layout
# (java -Djarmode=tools -jar app.jar extract at image build time for Spring Boot), see docs/adr/0003 and 0004.
app:
  image:
    repository: ""            # required
    tag: ""                   # used when digest is empty
    digest: ""                # sha256:...; when set it is used instead of the tag AND passed as --image-digest everywhere
    pullPolicy: IfNotPresent
  imagePullSecrets: []        # for the application image, as in a Deployment
  jar: /app/app.jar           # the launched JAR inside the application image
  jvmArgs: []                 # the JVM options the application really runs with, e.g. ["-Xmx512m"]; fetch and the trainer use them
  env: []                     # env that changes the JVM (JAVA_TOOL_OPTIONS, JDK_JAVA_OPTIONS): keep it identical to the Deployment's

cacheType: auto               # auto (AOT on JDK 25+, AppCDS otherwise), appcds or aot

# The tools image only carries the CLI into the application image (it contains no JDK).
tools:
  # How the tools reach the pod (docs/adr/0012):
  #   init-container  an init container copies them into an emptyDir, and a second one fetches the archive (default).
  #   image-volume    the tools image is mounted as an image volume and the fetch runs in the application container's own
  #                   entrypoint, so the pod has NO init containers on the start path. Needs a cluster and container runtime
  #                   that support image volumes (Kubernetes 1.33+ beta; containerd 2.1+ or CRI-O 1.31+): a pod on a cluster
  #                   without them does not start. With store.pullSecret the fetch stays in ONE isolated init container (the
  #                   install container is still gone): only it mounts the Secret, so application code cannot read it.
  delivery: init-container
  image:
    repository: ghcr.io/baokhang83/mnemo-warmup-tools
    digest: ""               # optional sha256 digest; required for isolated training unless explicitly disabled
    tag: "0.2.0"              # matches appVersion; published by the image workflow on release tags
    pullPolicy: IfNotPresent
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
    seccompProfile: { type: RuntimeDefault }

# Where archives live (ADR 0001): an OCI registry, one tag per fingerprint.
store:
  url: ""                     # required, e.g. oci://registry.example.com/team/warmup
  plainHttp: false            # http instead of https (local registries only)
  # Names of Secrets of type kubernetes.io/dockerconfigjson. Image-pull secrets are NOT visible to containers (only
  # to the kubelet), so these are mounted explicitly. fetch needs pull scope, the trainer pull+push scope; keep them
  # separate. Leave empty for an anonymous registry.
  pullSecret: ""
  pushSecret: ""

# Signed archives (docs/adr/0013-signed-archives.md). Off unless publicKeys is set. Create the key pair with
# `mnemo-warmup keygen`; it prints both values.
signing:
  # The public keys pods trust, "id=base64" separated by commas (several during a key rotation). Setting it makes every pod
  # require a valid signature: an unsigned archive, an untrusted key or an altered archive is ignored and the pod starts without
  # a cache. A list with nothing usable refuses every archive, so a typo cannot switch the check off.
  publicKeys: ""
  # A Secret holding the private key under the key signing.key (kubectl create secret generic NAME --from-file=signing.key=FILE).
  # It is mounted into the trainer only, which then signs everything it publishes. The file is readable by its owner (root) and its group
  # (mode 0440): a trainer that runs as a non-root user needs trainer.podSecurityContext.fsGroup, and the render fails without it.
  # The trainer also checks its key against publicKeys (when set) and refuses to sign with one that is not listed. Until the trainer is
  # split (ADR 0013, stage B), application code that runs during training can read this key.
  keySecret: ""

# The trainer (ADR 0002): a CronJob, not a Helm hook, so a failing trainer can never fail a release. Each run
# computes the fingerprint, exits if the store has it, otherwise takes a Lease, trains, uploads, and exits 0.
trainer:
  # Stage B: an independently trusted publisher starts a training pod with a separate identity.
  # The claim must support concurrent mounts by both pods (RWX, or scheduling on the same node).
  isolation:
    enabled: false
    publisherImage: ""             # trusted image containing the exact target JDK and extracted app files
    allowMutableImages: false       # testing only: permits mutable publisher and tools image tags
    publisherJava: ""              # absolute java path in the trusted publisher image
    handoffClaim: ""               # pre-provisioned shared PVC; directories are created per run
    trainingPodTimeoutSeconds: 1800 # includes scheduling, image pulls and training startup
    fsGroup: 65532                  # common writable group for coordinator and training pod
    trainingServiceAccount: ""    # optional existing unprivileged SA; otherwise create a dedicated one
    targetJavaToolOptions: ""     # target values as data; never applied to the publisher JVM
    targetJdkJavaOptions: ""
    allowedSecrets: []             # the only Secrets the training pod may reference (volumes, env, envFrom); others are refused
    publisherTmpSizeLimit: 1280Mi  # coordinator's private copy: at most 1 GiB of archive plus JVM temporary files
  enabled: true
  schedule: "*/10 * * * *"    # the first archive can wait up to one interval
  suspend: false
  exitMode: spring-refresh    # spring-refresh (Spring Boot, startup path only) or http-probe (any framework)
  timeoutSeconds: 300         # how long the app may take to become ready during training
  leaseSeconds: 1800          # how long a crashed trainer blocks others
  activeDeadlineSeconds: 3600 # hard limit for one run; keep it above timeoutSeconds plus the upload time
  probe:                      # http-probe only
    url: ""                   # e.g. http://localhost:8080/actuator/health
    warmupUrls: []            # GET requests sent once ready, to train the serving path
  # The trainer runs your application for real, so it needs your real configuration:
  env: []
  envFrom: []
  volumes: []
  volumeMounts: []
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}         # container security context of the trainer (it runs your application image)
  podSecurityContext: {}
  serviceAccount:
    create: true
    name: ""
    # On EKS, the IAM role the trainer assumes through IRSA (push scope on the archive repository):
    #   annotations: { eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/mnemo-warmup-push }
    annotations: {}
