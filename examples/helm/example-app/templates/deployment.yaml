apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app: {{ .Release.Name }}-app
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
    spec:
      {{- with .Values.warmup.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "mnemo-warmup.volumes" .Values.warmup | nindent 8 }}
      initContainers:
        {{- include "mnemo-warmup.installInitContainer" .Values.warmup | nindent 8 }}
        {{- include "mnemo-warmup.fetchInitContainer" .Values.warmup | nindent 8 }}
      containers:
        - name: app
          image: {{ include "mnemo-warmup.appImage" .Values.warmup | quote }}
          imagePullPolicy: {{ .Values.warmup.app.image.pullPolicy }}
          # The exec wrapper decides whether the fetched archive fits this exact launch, then execs java (PID 1).
          command: {{ include "mnemo-warmup.command" .Values.warmup }}
          args:
            - java
            {{- range .Values.warmup.app.jvmArgs }}
            - {{ . | quote }}
            {{- end }}
            {{- range .Values.javaOptions }}
            - {{ . | quote }}
            {{- end }}
            - -jar
            - {{ .Values.warmup.app.jar | quote }}
          env:
            {{- include "mnemo-warmup.env" .Values.warmup | nindent 12 }}
            {{- with .Values.warmup.app.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 60
          volumeMounts:
            {{- include "mnemo-warmup.volumeMounts" .Values.warmup | nindent 12 }}
